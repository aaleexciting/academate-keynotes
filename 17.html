<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slide 17 - Terima Kasih</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    :root{
      --bg:#F7F7FA;--text:#1E1F24;--muted:#6C6F7F;--border:#E5E6EE;
      --primary:#6F6CFF;--primary2:#8B7CFF;--blue:#4F8DF7;--cyan:#32A9B8;
      --green:#2EAD78;--orange:#E98B3A;--pink:#D866A7
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:Poppins,Arial,sans-serif;color:var(--text)}
    body{position:relative}
    button{font:inherit}

    .bg{position:fixed;inset:0;background:linear-gradient(135deg,#F7F7FA 0%,#EEF2FF 100%);z-index:0;overflow:hidden}
    .orb{position:absolute;border-radius:999px;filter:blur(86px);animation:float 25s ease-in-out infinite alternate}
    .orb.one{width:44vw;height:44vw;left:-14vw;top:-18vw;background:rgba(111,108,255,.16)}
    .orb.two{width:34vw;height:34vw;right:-9vw;bottom:-14vw;background:rgba(79,141,247,.15);animation-delay:-8s}
    .orb.three{width:28vw;height:28vw;left:45vw;top:43vh;background:rgba(139,124,255,.11);animation-delay:-15s}
    @keyframes float{from{transform:translate(0,0) scale(1)}to{transform:translate(3vw,3vh) scale(1.08)}}
    .pattern{position:absolute;inset:0;opacity:.55;background-image:radial-gradient(circle at 1px 1px,rgba(111,108,255,.16) 1px,transparent 0);background-size:34px 34px}

    .deck{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
    .top,.bottom{display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}
    .top{padding:28px 60px 18px}
    .bottom{padding:14px 60px 28px}
    .brand{display:flex;align-items:center;gap:14px}
    .brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:11px;overflow:hidden;background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;font-size:22px;font-weight:900;box-shadow:0 12px 28px rgba(111,108,255,.22)}
    .brand-mark img{width:100%;height:100%;object-fit:contain;display:block}
    .brand-fallback{place-items:center;width:100%;height:100%}
    .brand-name,.event{margin:0;font-weight:800;text-transform:uppercase;letter-spacing:.12em}
    .brand-name{font-size:20px}.event{font-size:16px;letter-spacing:.08em}
    .unsera{display:grid;place-items:center;width:64px;height:64px;overflow:hidden}
    .unsera img{width:100%;height:100%;object-fit:contain;display:block}
    .unsera-fallback{place-items:center;width:100%;height:100%;border:2px solid rgba(111,108,255,.6);border-radius:50%;color:var(--primary);font-size:10px;font-weight:900}
    .institution{margin-left:18px;text-transform:uppercase;line-height:1.36;font-size:12px;font-weight:700;letter-spacing:.05em}
    .institution p{margin:0}.foot-left{display:flex;align-items:center}

    .main{position:relative;flex:1;min-height:0;padding:0 60px;display:grid;place-items:center}
    .finale{position:relative;width:min(1120px,100%);height:100%;display:grid;place-items:center;text-align:center}
    .halo{position:absolute;left:50%;top:50%;width:min(53vw,710px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-48%);background:radial-gradient(circle,rgba(255,255,255,.98) 0 22%,rgba(245,243,255,.78) 23% 42%,rgba(111,108,255,.08) 43% 57%,transparent 58%);filter:drop-shadow(0 28px 52px rgba(111,108,255,.08));pointer-events:none}
    .ring{position:absolute;left:50%;top:50%;border:1px solid rgba(111,108,255,.17);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
    .ring.r1{width:min(34vw,470px);aspect-ratio:1;animation:ringBreath 6s ease-in-out infinite}
    .ring.r2{width:min(44vw,610px);aspect-ratio:1;border-style:dashed;animation:spin 40s linear infinite}
    .ring.r3{width:min(52vw,720px);aspect-ratio:1;opacity:.55;animation:ringBreath 7.4s ease-in-out infinite reverse}
    @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
    @keyframes ringBreath{0%,100%{opacity:.38;scale:1}50%{opacity:.8;scale:1.025}}

    .node{--x:0px;--y:0px;position:absolute;left:50%;top:50%;display:grid;place-items:center;width:54px;height:54px;border:1px solid rgba(255,255,255,.95);border-radius:17px;background:rgba(255,255,255,.87);box-shadow:0 16px 34px rgba(30,31,36,.09);backdrop-filter:blur(14px);color:var(--primary);font-size:24px;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y)));animation:nodeFloat 5.4s ease-in-out infinite}
    .node.n1{--x:-300px;--y:-126px;color:var(--primary);animation-delay:-.7s}
    .node.n2{--x:300px;--y:-126px;color:var(--blue);animation-delay:-1.5s}
    .node.n3{--x:-346px;--y:78px;color:var(--green);animation-delay:-2.1s}
    .node.n4{--x:346px;--y:78px;color:var(--orange);animation-delay:-2.9s}
    .node.n5{--x:-226px;--y:214px;color:var(--pink);animation-delay:-3.4s}
    .node.n6{--x:226px;--y:214px;color:var(--cyan);animation-delay:-4.2s}
    @keyframes nodeFloat{0%,100%{margin-top:0}50%{margin-top:-10px}}

    .center{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;max-width:820px;margin-top:-4px}
    .kicker{display:flex;align-items:center;gap:12px;margin:0 0 18px;color:var(--primary);font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
    .kicker:before,.kicker:after{content:"";width:42px;height:2px;border-radius:999px;background:linear-gradient(90deg,transparent,var(--primary))}
    .kicker:after{background:linear-gradient(90deg,var(--primary),transparent)}
    .logo-hero{position:relative;display:grid;place-items:center;width:106px;height:106px;margin-bottom:24px;border-radius:29px;background:linear-gradient(135deg,var(--primary),var(--primary2));box-shadow:0 25px 55px rgba(111,108,255,.28);animation:logoFloat 5s ease-in-out infinite}
    .logo-hero:before{content:"";position:absolute;inset:-12px;border:1px solid rgba(111,108,255,.18);border-radius:39px;transform:rotate(8deg)}
    .logo-hero img{width:100%;height:100%;object-fit:contain;border-radius:inherit;display:block}
    .logo-fallback{display:none;place-items:center;width:100%;height:100%;color:#fff;font-size:54px;font-weight:900}
    @keyframes logoFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(1.5deg)}}
    h1{margin:0;font-size:76px;line-height:.96;font-weight:900;letter-spacing:-.055em;text-transform:uppercase;background:linear-gradient(135deg,#1E1F24 18%,#605BE0 72%,#8B7CFF 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
    .thanks-line{margin:20px 0 0;color:var(--muted);font-size:18px;line-height:1.55;font-weight:500}
    .signature{display:flex;align-items:center;gap:9px;margin-top:25px;padding-top:18px;border-top:1px solid rgba(108,111,127,.18);color:#555866;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    .signature i{color:var(--primary);font-size:17px}

    .native-hidden{opacity:0!important;visibility:hidden!important;pointer-events:none!important}
    .deck-frame{position:fixed;inset:0;z-index:900;width:100%;height:100%;border:0;background:#F7F7FA;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .34s ease,visibility .34s ease}
    .deck-frame.is-current{opacity:1;visibility:visible;pointer-events:auto}
    .controls{position:fixed;right:26px;bottom:22px;z-index:1000;display:flex;align-items:center;gap:8px;padding:7px;border:1px solid rgba(255,255,255,.9);border-radius:16px;background:rgba(255,255,255,.82);box-shadow:0 14px 35px rgba(30,31,36,.13);backdrop-filter:blur(18px)}
    .controls a,.controls button{display:grid;place-items:center;width:38px;height:38px;border:0;border-radius:11px;background:transparent;color:var(--text);text-decoration:none;font:800 18px/1 Poppins;cursor:pointer}
    .controls a:hover,.controls button:hover{background:#F1F0FF;color:var(--primary)}
    .controls a[aria-disabled="true"]{opacity:.34;pointer-events:none}
    .progress{font-size:12px;font-weight:800;color:var(--muted);min-width:64px;text-align:center;letter-spacing:.08em}

    @media(max-aspect-ratio:16/10){
      .top{padding:20px 54px 12px}.bottom{padding:8px 54px 20px}.main{padding:0 54px}.unsera{width:58px;height:58px}.institution{font-size:11px}
      h1{font-size:65px}.logo-hero{width:92px;height:92px;border-radius:25px;margin-bottom:19px}.thanks-line{font-size:16px;margin-top:15px}.signature{margin-top:18px;padding-top:14px}.kicker{margin-bottom:13px}
      .node{width:48px;height:48px;border-radius:15px;font-size:21px}.node.n1{--x:-255px;--y:-108px}.node.n2{--x:255px;--y:-108px}.node.n3{--x:-292px;--y:65px}.node.n4{--x:292px;--y:65px}.node.n5{--x:-190px;--y:178px}.node.n6{--x:190px;--y:178px}
    }
    @media(max-width:900px){
      .top{padding-left:28px;padding-right:28px}.bottom{padding-left:28px;padding-right:28px}.main{padding:0 28px}.event{font-size:13px}.brand-name{font-size:17px}.node{opacity:.65;transform:translate(calc(-50% + var(--x) * .72),calc(-50% + var(--y) * .72))}h1{font-size:54px}.thanks-line{font-size:14px}.controls{right:14px;bottom:14px}
    }
    html:fullscreen h1,html:-webkit-full-screen h1{font-size:80px}
    html:fullscreen .thanks-line,html:-webkit-full-screen .thanks-line{font-size:19px}
  </style>
</head>
<body data-page="17">
  <div class="bg"><div class="orb one"></div><div class="orb two"></div><div class="orb three"></div><div class="pattern"></div></div>

  <div class="deck">
    <header class="top">
      <div class="brand">
        <div class="brand-mark"><img src="academate_logo.png" alt="Logo Academate" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><span class="brand-fallback" style="display:none">A</span></div>
        <p class="brand-name">Academate</p>
      </div>
      <p class="event">Sidang Kolokium 2026</p>
    </header>

    <main class="main">
      <section class="finale">
        <div class="halo"></div>
        <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
        <span class="node n1" aria-hidden="true"><i class="ri-group-2-line"></i></span>
        <span class="node n2" aria-hidden="true"><i class="ri-task-line"></i></span>
        <span class="node n3" aria-hidden="true"><i class="ri-calendar-2-line"></i></span>
        <span class="node n4" aria-hidden="true"><i class="ri-file-list-3-line"></i></span>
        <span class="node n5" aria-hidden="true"><i class="ri-discuss-line"></i></span>
        <span class="node n6" aria-hidden="true"><i class="ri-notification-3-line"></i></span>

        <div class="center">
          <p class="kicker">Slide 17 · Penutup</p>
          <div class="logo-hero"><img src="academate_logo.png" alt="Logo Academate" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><span class="logo-fallback">A</span></div>
          <h1>Terima Kasih</h1>
          <p class="thanks-line">Terima kasih atas perhatian dan waktunya.</p>
          <div class="signature"><i class="ri-sparkling-2-line"></i><span>Academate · Sidang Kolokium 2026</span></div>
        </div>
      </section>
    </main>

    <footer class="bottom">
      <div class="foot-left">
        <div class="unsera"><img src="unsera_logo.png" alt="Logo Universitas Serang Raya" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><span class="unsera-fallback" style="display:none">UNSERA</span></div>
        <div class="institution"><p>Program Studi Teknik Informatika</p><p>Fakultas Teknologi Informasi</p><p>Universitas Serang Raya</p></div>
      </div>
    </footer>
  </div>

  <nav class="controls" aria-label="Navigasi presentasi">
    <a class="deck-prev" href="16.html" aria-label="Slide sebelumnya">←</a>
    <span class="progress">17 / 17</span>
    <a class="deck-next" href="17.html" aria-label="Slide berikutnya" aria-disabled="true">→</a>
    <button class="deck-fullscreen" type="button" aria-label="Masuk atau keluar layar penuh" title="Layar penuh (F)"><i class="ri-fullscreen-line"></i></button>
  </nav>

  <script>
  (() => {
    const PAGE_NUMBER = 17;
    const PAGE_FILES = ["1.html","2.html","3.html","4.html","5.html","6.html","7.html","8.html","9.html","10.html","11.html","12.html","13.html","14.html","15.html","16.html","17.html"];
    const TOTAL_PAGES = PAGE_FILES.length;
    const embedded = window.self !== window.top;
    const controls = document.querySelector('.controls');
    const progress = document.querySelector('.progress');
    const prev = document.querySelector('.deck-prev');
    const next = document.querySelector('.deck-next');
    const fsButton = document.querySelector('.deck-fullscreen');

    function isTypingTarget(target){const tag=target&&target.tagName?target.tagName.toLowerCase():'';return tag==='input'||tag==='textarea'||tag==='select'||(target&&target.isContentEditable)}
    function requestFullscreen(){const root=document.documentElement;const request=root.requestFullscreen||root.webkitRequestFullscreen;if(request){const result=request.call(root);if(result&&typeof result.catch==='function')result.catch(()=>{})}}
    function exitFullscreen(){const exit=document.exitFullscreen||document.webkitExitFullscreen;if(exit){const result=exit.call(document);if(result&&typeof result.catch==='function')result.catch(()=>{})}}
    function toggleFullscreen(){const active=document.fullscreenElement||document.webkitFullscreenElement;active?exitFullscreen():requestFullscreen()}

    if(embedded){
      document.body.classList.add('is-embedded');
      if(controls)controls.style.display='none';
      document.addEventListener('keydown',(event)=>{
        if(isTypingTarget(event.target))return;
        if(["ArrowRight","ArrowDown"," ","PageDown"].includes(event.key)){event.preventDefault();window.top.postMessage({type:'academate:navigate',page:Math.min(TOTAL_PAGES,PAGE_NUMBER+1)},'*')}
        else if(["ArrowLeft","ArrowUp","PageUp"].includes(event.key)){event.preventDefault();window.top.postMessage({type:'academate:navigate',page:Math.max(1,PAGE_NUMBER-1)},'*')}
        else if(event.key.toLowerCase()==='f'){event.preventDefault();window.top.postMessage({type:'academate:fullscreen'},'*')}
      });
      window.top.postMessage({type:'academate:ready',page:PAGE_NUMBER},'*');
      return;
    }

    const nativeNodes=[document.querySelector('.bg'),document.querySelector('.deck')].filter(Boolean);
    const frames=new Map();let currentPage=PAGE_NUMBER;let pendingPage=null;
    PAGE_FILES.forEach((file,index)=>{
      const page=index+1;if(page===PAGE_NUMBER)return;
      const frame=document.createElement('iframe');frame.className='deck-frame';frame.dataset.page=String(page);frame.title=`Slide ${page} dari ${TOTAL_PAGES}`;frame.src=`${file}?embedded=1`;frame.setAttribute('aria-hidden','true');
      frame.addEventListener('load',()=>{frame.dataset.ready='true';if(pendingPage===page)switchTo(page)},{once:true});
      document.body.appendChild(frame);frames.set(page,frame);
    });

    function updateControls(){
      if(progress)progress.textContent=`${String(currentPage).padStart(2,'0')} / ${String(TOTAL_PAGES).padStart(2,'0')}`;
      if(prev){prev.href=PAGE_FILES[Math.max(0,currentPage-2)];prev.setAttribute('aria-disabled',String(currentPage===1))}
      if(next){next.href=PAGE_FILES[Math.min(TOTAL_PAGES-1,currentPage)];next.setAttribute('aria-disabled',String(currentPage===TOTAL_PAGES))}
    }
    function switchTo(page){
      page=Number(page);if(!Number.isFinite(page)||page<1||page>TOTAL_PAGES||page===currentPage)return;
      const target=page===PAGE_NUMBER?null:frames.get(page);if(target&&target.dataset.ready!=='true'){pendingPage=page;return}pendingPage=null;
      nativeNodes.forEach(node=>node.classList.toggle('native-hidden',page!==PAGE_NUMBER));frames.forEach((frame,number)=>{const active=number===page;frame.classList.toggle('is-current',active);frame.setAttribute('aria-hidden',String(!active))});currentPage=page;updateControls();try{window.history.replaceState({page:currentPage},'',`#slide-${currentPage}`)}catch(_){}}
    function navigate(delta){switchTo(currentPage+delta)}

    if(prev)prev.addEventListener('click',(event)=>{event.preventDefault();navigate(-1)});
    if(next)next.addEventListener('click',(event)=>{event.preventDefault();navigate(1)});
    if(fsButton)fsButton.addEventListener('click',toggleFullscreen);
    document.addEventListener('keydown',(event)=>{if(isTypingTarget(event.target))return;if(["ArrowRight","ArrowDown"," ","PageDown"].includes(event.key)){event.preventDefault();navigate(1)}else if(["ArrowLeft","ArrowUp","PageUp"].includes(event.key)){event.preventDefault();navigate(-1)}else if(event.key.toLowerCase()==='f'){event.preventDefault();toggleFullscreen()}});
    window.addEventListener('message',(event)=>{if(!event.data||typeof event.data!=='object')return;if(event.data.type==='academate:navigate')switchTo(event.data.page);if(event.data.type==='academate:fullscreen')toggleFullscreen()});
    window.addEventListener('popstate',(event)=>{if(event.state&&event.state.page)switchTo(event.state.page)});
    updateControls();
  })();
  </script>
</body>
</html>
