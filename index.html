<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F7FA" />
  <meta name="color-scheme" content="light" />
  <title>Academate — Sidang Kolokium 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    :root{
      --bg:#F7F7FA;
      --text:#1E1F24;
      --muted:#6C6F7F;
      --primary:#6F6CFF;
      --primary2:#8B7CFF;
      --transition:360ms;
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:Poppins,Arial,sans-serif;color:var(--text)}
    body{overscroll-behavior:none}
    button,a{font:inherit}

    .deck-shell{position:fixed;inset:0;background:linear-gradient(135deg,#F7F7FA 0%,#EEF2FF 100%);isolation:isolate}
    .deck-stage{position:absolute;inset:0;overflow:hidden;background:var(--bg)}
    .deck-stage::before{
      content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
      background:
        radial-gradient(circle at 12% 8%,rgba(111,108,255,.10),transparent 34%),
        radial-gradient(circle at 88% 86%,rgba(79,141,247,.09),transparent 31%);
    }

    .slide-frame{
      position:absolute;inset:0;z-index:1;width:100%;height:100%;border:0;background:var(--bg);
      opacity:0;visibility:hidden;pointer-events:none;transform:translate3d(22px,0,0) scale(.997);
      transition:opacity var(--transition) cubic-bezier(.22,.8,.2,1),transform var(--transition) cubic-bezier(.22,.8,.2,1),visibility 0s linear var(--transition);
    }
    .slide-frame.is-active{z-index:3;opacity:1;visibility:visible;pointer-events:auto;transform:none;transition-delay:0s}
    .slide-frame.is-leaving{z-index:2;opacity:0;visibility:visible;pointer-events:none;transform:translate3d(-22px,0,0) scale(.997)}

    .deck-loader{
      position:absolute;left:50%;top:50%;z-index:4;display:flex;align-items:center;gap:10px;padding:10px 14px;
      border:1px solid rgba(255,255,255,.9);border-radius:13px;background:rgba(255,255,255,.84);
      box-shadow:0 14px 34px rgba(30,31,36,.10);backdrop-filter:blur(14px);
      color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.03em;
      opacity:0;visibility:hidden;transform:translate(-50%,-42%);transition:.2s ease;pointer-events:none;
    }
    .deck-loader.is-visible{opacity:1;visibility:visible;transform:translate(-50%,-50%)}
    .deck-loader i{color:var(--primary);font-size:16px;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    .deck-error{
      position:absolute;left:50%;top:50%;z-index:6;width:min(420px,calc(100vw - 40px));padding:22px;text-align:center;
      border:1px solid #E5E6EE;border-radius:18px;background:rgba(255,255,255,.96);box-shadow:0 20px 54px rgba(30,31,36,.14);
      transform:translate(-50%,-50%);display:none;
    }
    .deck-error.is-visible{display:block}
    .deck-error i{display:grid;place-items:center;width:44px;height:44px;margin:0 auto 12px;border-radius:14px;background:#F1F0FF;color:var(--primary);font-size:22px}
    .deck-error h1{margin:0 0 7px;font-size:18px}.deck-error p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}
    .deck-error button{margin-top:16px;padding:9px 13px;border:0;border-radius:10px;background:var(--primary);color:#fff;font-size:11px;font-weight:800;cursor:pointer}

    .presentation-controls{
      position:fixed;right:26px;bottom:22px;z-index:1000;display:flex;align-items:center;gap:8px;padding:7px;
      border:1px solid rgba(255,255,255,.9);border-radius:16px;background:rgba(255,255,255,.84);
      box-shadow:0 14px 35px rgba(30,31,36,.13);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
      transition:opacity .2s ease,transform .2s ease;
    }
    .presentation-controls[data-busy="true"]{opacity:.72}
    .presentation-controls button{
      display:grid;place-items:center;width:38px;height:38px;border:0;border-radius:11px;background:transparent;color:var(--text);
      font:800 18px/1 Poppins;cursor:pointer;transition:background .18s ease,color .18s ease,transform .18s ease;
    }
    .presentation-controls button:hover:not(:disabled){background:#F1F0FF;color:var(--primary)}
    .presentation-controls button:active:not(:disabled){transform:scale(.94)}
    .presentation-controls button:disabled{opacity:.30;cursor:default}
    .presentation-progress{min-width:66px;text-align:center;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.08em;user-select:none}
    .deck-fullscreen.is-active{background:#F1F0FF;color:var(--primary)}

    @media(max-width:800px){
      .presentation-controls{right:12px;bottom:10px;transform:scale(.92);transform-origin:right bottom}
    }
    @media(prefers-reduced-motion:reduce){
      :root{--transition:1ms}
      *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
    }
  </style>
</head>
<body>
  <div class="deck-shell" id="deck-shell">
    <main class="deck-stage" id="deck-stage" aria-label="Presentasi Academate">
      <iframe class="slide-frame" id="frame-a" title="Slide Academate" allow="fullscreen; autoplay" allowfullscreen aria-hidden="true"></iframe>
      <iframe class="slide-frame" id="frame-b" title="Slide Academate" allow="fullscreen; autoplay" allowfullscreen aria-hidden="true"></iframe>
      <div class="deck-loader" id="deck-loader" role="status" aria-live="polite"><i class="ri-loader-4-line"></i><span>Memuat slide…</span></div>
      <section class="deck-error" id="deck-error" role="alert">
        <i class="ri-error-warning-line"></i>
        <h1>Slide tidak dapat dimuat</h1>
        <p>Coba muat ulang slide ini. Presentasi sebelumnya tetap aman.</p>
        <button type="button" id="retry-slide">Muat Ulang</button>
      </section>
    </main>

    <nav class="presentation-controls" id="presentation-controls" aria-label="Navigasi presentasi" data-busy="false">
      <button class="deck-prev" type="button" aria-label="Slide sebelumnya" title="Sebelumnya (←)"><i class="ri-arrow-left-line"></i></button>
      <span class="presentation-progress" aria-live="polite">01 / 17</span>
      <button class="deck-next" type="button" aria-label="Slide berikutnya" title="Berikutnya (→)"><i class="ri-arrow-right-line"></i></button>
      <button class="deck-fullscreen" type="button" aria-label="Masuk atau keluar layar penuh" title="Layar penuh (F)"><i class="ri-fullscreen-line"></i></button>
    </nav>
  </div>

  <script>
  (() => {
    'use strict';

    const TOTAL_PAGES = 17;
    const TRANSITION_MS = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 360;
    const LOAD_TIMEOUT_MS = 10000;
    const SLIDE_FILES = Array.from({length: TOTAL_PAGES}, (_, index) => `${index + 1}.html`);

    const stage = document.getElementById('deck-stage');
    const controls = document.getElementById('presentation-controls');
    const progress = document.querySelector('.presentation-progress');
    const prevButton = document.querySelector('.deck-prev');
    const nextButton = document.querySelector('.deck-next');
    const fullscreenButton = document.querySelector('.deck-fullscreen');
    const fullscreenIcon = fullscreenButton.querySelector('i');
    const loader = document.getElementById('deck-loader');
    const errorPanel = document.getElementById('deck-error');
    const retryButton = document.getElementById('retry-slide');

    let activeFrame = document.getElementById('frame-a');
    let standbyFrame = document.getElementById('frame-b');
    let currentPage = 1;
    let requestedPage = 1;
    let transitionInProgress = false;
    let transitionToken = 0;
    let loadTimer = null;
    let loaderTimer = null;
    let pendingHistoryPage = null;

    const nextKeys = new Set(['ArrowRight','ArrowDown',' ','PageDown']);
    const previousKeys = new Set(['ArrowLeft','ArrowUp','PageUp']);

    function clampPage(page) {
      const value = Number(page);
      if (!Number.isFinite(value)) return 1;
      return Math.min(TOTAL_PAGES, Math.max(1, Math.round(value)));
    }

    function pageFromLocation() {
      const match = window.location.hash.match(/^#slide-(\d+)$/i);
      return match ? clampPage(match[1]) : 1;
    }

    function slideUrl(page) {
      return `${SLIDE_FILES[page - 1]}?embedded=1&deck=1`;
    }

    function isInteractiveTarget(target) {
      return Boolean(target && target.nodeType === 1 && typeof target.closest === 'function' && target.closest('input,textarea,select,button,a,[contenteditable="true"],[role="textbox"],[role="slider"]'));
    }

    function createBlankFrame() {
      const frame = document.createElement('iframe');
      frame.className = 'slide-frame';
      frame.title = 'Slide Academate';
      frame.setAttribute('allow', 'fullscreen; autoplay');
      frame.setAttribute('allowfullscreen', '');
      frame.setAttribute('aria-hidden', 'true');
      stage.insertBefore(frame, loader);
      return frame;
    }

    function setBusy(busy) {
      transitionInProgress = busy;
      controls.dataset.busy = String(busy);
      updateControls();
    }

    function updateControls() {
      progress.textContent = `${String(currentPage).padStart(2,'0')} / ${String(TOTAL_PAGES).padStart(2,'0')}`;
      prevButton.disabled = transitionInProgress || currentPage <= 1;
      nextButton.disabled = transitionInProgress || currentPage >= TOTAL_PAGES;
      prevButton.setAttribute('aria-disabled', String(prevButton.disabled));
      nextButton.setAttribute('aria-disabled', String(nextButton.disabled));
      document.title = `Academate — Slide ${currentPage} / ${TOTAL_PAGES}`;
    }

    function showLoader() {
      window.clearTimeout(loaderTimer);
      loaderTimer = window.setTimeout(() => loader.classList.add('is-visible'), 120);
    }

    function hideLoader() {
      window.clearTimeout(loaderTimer);
      loader.classList.remove('is-visible');
    }

    function showError() {
      hideLoader();
      errorPanel.classList.add('is-visible');
      setBusy(false);
    }

    function hideError() {
      errorPanel.classList.remove('is-visible');
    }

    function writeHistory(page, mode = 'push') {
      const url = `${window.location.pathname}${window.location.search}#slide-${page}`;
      const state = {page};
      try {
        if (mode === 'replace') window.history.replaceState(state, '', url);
        else window.history.pushState(state, '', url);
      } catch (_) {}
    }

    function prefetch(page) {
      if (page < 1 || page > TOTAL_PAGES) return;
      const selector = `link[data-prefetch-slide="${page}"]`;
      if (document.head.querySelector(selector)) return;
      const link = document.createElement('link');
      link.rel = 'prefetch';
      link.as = 'document';
      link.href = slideUrl(page);
      link.dataset.prefetchSlide = String(page);
      document.head.appendChild(link);
    }

    function prefetchNeighbors(page) {
      prefetch(page - 1);
      prefetch(page + 1);
    }

    function handleDeckKey(event, fromChild = false) {
      if (event.defaultPrevented || event.ctrlKey || event.metaKey || event.altKey || isInteractiveTarget(event.target)) return;

      let action = null;
      if (nextKeys.has(event.key)) action = () => navigateRelative(1);
      else if (previousKeys.has(event.key)) action = () => navigateRelative(-1);
      else if (event.key === 'Home') action = () => navigateTo(1);
      else if (event.key === 'End') action = () => navigateTo(TOTAL_PAGES);
      else if (event.key.toLowerCase() === 'f') action = toggleFullscreen;
      if (!action) return;

      event.preventDefault();
      if (fromChild) {
        event.stopPropagation();
        if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
      }
      if (event.repeat) return;
      action();
    }

    function installChildBridge(frame, page) {
      frame.dataset.page = String(page);
      frame.title = `Slide ${page} dari ${TOTAL_PAGES}`;
      try {
        const childWindow = frame.contentWindow;
        const childDocument = frame.contentDocument || childWindow.document;
        if (!childDocument || childDocument.documentElement.dataset.deckBridge === '1') return;
        childDocument.documentElement.dataset.deckBridge = '1';
        childDocument.addEventListener('keydown', event => handleDeckKey(event, true), true);
      } catch (_) {
        // postMessage dari slide tetap menjadi fallback bila akses same-origin tidak tersedia.
      }
    }

    function processPendingHistory() {
      if (pendingHistoryPage === null || transitionInProgress) return;
      const target = pendingHistoryPage;
      pendingHistoryPage = null;
      if (target !== currentPage) window.setTimeout(() => navigateTo(target, {history:false}), 0);
    }

    function finalizeFrameSwap(targetPage, token, historyMode) {
      if (token !== transitionToken) return;

      const outgoing = activeFrame;
      const incoming = standbyFrame;
      incoming.classList.add('is-active');
      incoming.classList.remove('is-leaving');
      outgoing.classList.remove('is-active');
      outgoing.classList.add('is-leaving');

      window.setTimeout(() => {
        if (token !== transitionToken) return;
        outgoing.remove();
        activeFrame = incoming;
        standbyFrame = createBlankFrame();
        currentPage = targetPage;
        requestedPage = targetPage;
        setBusy(false);
        hideLoader();
        updateControls();
        if (historyMode) writeHistory(currentPage, historyMode);
        prefetchNeighbors(currentPage);
        processPendingHistory();
      }, TRANSITION_MS + 24);
    }

    function loadPageIntoStandby(targetPage, historyMode) {
      const token = ++transitionToken;
      requestedPage = targetPage;
      hideError();
      setBusy(true);
      showLoader();

      window.clearTimeout(loadTimer);
      standbyFrame.classList.remove('is-active','is-leaving');
      standbyFrame.setAttribute('aria-hidden','true');

      const onLoad = () => {
        if (token !== transitionToken) return;
        window.clearTimeout(loadTimer);
        installChildBridge(standbyFrame, targetPage);
        standbyFrame.setAttribute('aria-hidden','false');
        requestAnimationFrame(() => requestAnimationFrame(() => finalizeFrameSwap(targetPage, token, historyMode)));
      };

      standbyFrame.addEventListener('load', onLoad, {once:true});
      standbyFrame.src = slideUrl(targetPage);
      loadTimer = window.setTimeout(() => {
        if (token !== transitionToken) return;
        ++transitionToken;
        showError();
      }, LOAD_TIMEOUT_MS);
    }

    function navigateTo(page, options = {}) {
      const targetPage = clampPage(page);
      if (targetPage === currentPage || transitionInProgress) return;
      const historyMode = options.history === false ? null : (options.replace ? 'replace' : 'push');
      loadPageIntoStandby(targetPage, historyMode);
    }

    function navigateRelative(delta) {
      if (transitionInProgress) return;
      navigateTo(currentPage + delta);
    }

    async function toggleFullscreen() {
      const active = document.fullscreenElement || document.webkitFullscreenElement;
      try {
        if (active) {
          const exit = document.exitFullscreen || document.webkitExitFullscreen;
          if (exit) await exit.call(document);
        } else {
          const root = document.documentElement;
          const request = root.requestFullscreen || root.webkitRequestFullscreen;
          if (request) await request.call(root);
        }
      } catch (_) {}
    }

    function updateFullscreenControl() {
      const active = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
      fullscreenButton.classList.toggle('is-active', active);
      fullscreenButton.setAttribute('aria-label', active ? 'Keluar dari layar penuh' : 'Masuk ke layar penuh');
      fullscreenIcon.className = active ? 'ri-fullscreen-exit-line' : 'ri-fullscreen-line';
    }

    function handleHistoryTarget(page) {
      const target = clampPage(page);
      if (transitionInProgress) {
        pendingHistoryPage = target;
        return;
      }
      if (target !== currentPage) navigateTo(target, {history:false});
    }

    function loadInitialPage() {
      const initialPage = pageFromLocation();
      currentPage = initialPage;
      requestedPage = initialPage;
      setBusy(true);
      showLoader();

      const token = ++transitionToken;
      activeFrame.addEventListener('load', () => {
        if (token !== transitionToken) return;
        window.clearTimeout(loadTimer);
        installChildBridge(activeFrame, initialPage);
        activeFrame.classList.add('is-active');
        activeFrame.setAttribute('aria-hidden','false');
        setBusy(false);
        hideLoader();
        updateControls();
        writeHistory(initialPage, 'replace');
        prefetchNeighbors(initialPage);
        processPendingHistory();
      }, {once:true});
      activeFrame.src = slideUrl(initialPage);
      loadTimer = window.setTimeout(() => {
        if (token !== transitionToken) return;
        ++transitionToken;
        showError();
      }, LOAD_TIMEOUT_MS);
    }

    prevButton.addEventListener('click', () => navigateRelative(-1));
    nextButton.addEventListener('click', () => navigateRelative(1));
    fullscreenButton.addEventListener('click', toggleFullscreen);
    retryButton.addEventListener('click', () => {
      ++transitionToken;
      window.clearTimeout(loadTimer);
      hideError();
      setBusy(false);

      if (requestedPage === currentPage) {
        const page = currentPage;
        activeFrame.remove();
        activeFrame = createBlankFrame();
        activeFrame.addEventListener('load', () => {
          installChildBridge(activeFrame, page);
          activeFrame.classList.add('is-active');
          activeFrame.setAttribute('aria-hidden','false');
          hideLoader();
          updateControls();
        }, {once:true});
        showLoader();
        activeFrame.src = slideUrl(page);
      } else {
        standbyFrame.remove();
        standbyFrame = createBlankFrame();
        navigateTo(requestedPage, {history:false});
      }
    });

    document.addEventListener('keydown', event => handleDeckKey(event, false), true);
    document.addEventListener('fullscreenchange', updateFullscreenControl);
    document.addEventListener('webkitfullscreenchange', updateFullscreenControl);

    window.addEventListener('message', event => {
      if (!activeFrame.contentWindow || event.source !== activeFrame.contentWindow) return;
      const data = event.data;
      if (!data || typeof data !== 'object') return;

      if (data.type === 'academate:fullscreen') {
        toggleFullscreen();
        return;
      }
      if (data.type === 'academate:navigate') {
        const target = clampPage(data.page);
        if (Math.abs(target - currentPage) === 1) navigateTo(target);
      }
    });

    window.addEventListener('popstate', event => {
      const target = event.state && event.state.page ? event.state.page : pageFromLocation();
      handleHistoryTarget(target);
    });

    window.addEventListener('hashchange', () => handleHistoryTarget(pageFromLocation()));

    window.addEventListener('pageshow', () => {
      updateControls();
      updateFullscreenControl();
    });

    loadInitialPage();
  })();
  </script>
</body>
</html>
